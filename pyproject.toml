[project]
name = "chickenbot"
version = "0.1.0"
description = "A chat bot that logs the room, answers with an LLM, keeps order, and watches GitHub repos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
signal = ["signalbot>=2.0"]
discord = ["discord.py>=2.4"]
telegram = ["python-telegram-bot>=21"]

[project.scripts]
chickenbot = "chickenbot.__main__:main"

[dependency-groups]
# Optional for users, but the tests cover every provider and transport.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "anthropic>=1.0",
    "signalbot>=2.0",
    "discord.py>=2.4",
    "python-telegram-bot>=21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chickenbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
