[project]
name = "chickenbot"
version = "0.1.0"
description = "An IRC bot that logs the channel, answers with an LLM, keeps order, and watches GitHub repos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]

[project.scripts]
chickenbot = "chickenbot.__main__:main"

[dependency-groups]
# anthropic is optional for users, but the tests cover that provider.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chickenbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
